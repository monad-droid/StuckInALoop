<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .status-card {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 22px;
      font-weight: 700;
    }
    .status-value.safe { color: #4ecca3; }
    .status-value.warning { color: #f0a500; }
    .status-value.danger { color: #e94560; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 4px;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16213e;
      border-radius: 10px;
      padding: 12px 16px;
    }
    .toggle-row label {
      font-size: 13px;
      color: #ccc;
    }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.2s;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .toggle input:checked + .slider {
      background: #e94560;
    }
    .toggle input:checked + .slider::before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 24px;">&#x1F300;</span>
    <h1>Stuck In A Loop</h1>
  </div>

  <div class="status-card">
    <div class="status-label">Status</div>
    <div class="status-value safe" id="status">Focused</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Since last typing</div>
      <div class="stat-value" id="typing-time">0m</div>
    </div>
    <div class="stat">
      <div class="stat-label">Tab switches (15m)</div>
      <div class="stat-value" id="switch-count">0</div>
    </div>
  </div>

  <div class="toggle-row">
    <label>Detection enabled</label>
    <div class="toggle">
      <input type="checkbox" id="enabled-toggle" checked>
      <span class="slider"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
